name: Release

# Deploy: crie e envie uma tag "vX.Y.Z" (ex.: git tag v0.2.0 && git push origin v0.2.0).
# Este workflow testa, compila, empacota e publica a release; o AutoCAD do engenheiro
# encontra a versão nova na próxima vez que abrir e pergunta se quer atualizar.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes do motor
        run: dotnet test tests/AlvMod.Core.Tests/AlvMod.Core.Tests.csproj -c Release

      - name: Compilar e empacotar
        shell: pwsh
        run: ./build/empacotar.ps1 -Versao ("${{ github.ref_name }}".TrimStart('v')) -Repo "${{ github.repository }}"

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem out/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
